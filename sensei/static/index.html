<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sensei · 物知りの友</title>
<style>
  :root {
    --bg: #faf7f2; --panel: #ffffff; --ink: #2b2620; --muted: #7a7064;
    --accent: #b5452f; --accent-ink: #ffffff; --me: #efe6d8; --line: #e6ddcf; --code: #f3eee6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1916; --panel: #24211d; --ink: #ece5da; --muted: #a3998b;
      --accent: #e0745c; --accent-ink: #1b1916; --me: #332e27; --line: #3a342c; --code: #2d2924;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.65 -apple-system, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header h1 span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
  #meta { color: var(--muted); font-size: 13px; text-align: right; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin: 0 0 16px; padding: 12px 14px; border-radius: 14px; overflow-wrap: anywhere; }
  .me { background: var(--me); margin-left: 15%; white-space: pre-wrap; }
  .sensei { background: var(--panel); border: 1px solid var(--line); }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .sensei p { margin: 0 0 .6em; } .sensei p:last-child { margin-bottom: 0; }
  .sensei ul, .sensei ol { margin: .2em 0 .6em; padding-left: 1.3em; }
  .sensei h3, .sensei h4 { margin: .6em 0 .3em; font-size: 1em; }
  .sensei code { background: var(--code); padding: 1px 5px; border-radius: 5px; font-size: .92em; }
  .sensei table { border-collapse: collapse; margin: .4em 0; font-size: 14px; display: block; overflow-x: auto; }
  .sensei td, .sensei th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px 0; max-width: 792px; margin: 0 auto; width: 100%; }
  .chip {
    flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer;
  }
  @media (min-width: 720px) { .chips { flex-wrap: wrap; overflow-x: visible; } }
  .chip:hover { border-color: var(--accent); }
  form { display: flex; gap: 8px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); max-width: 792px; margin: 0 auto; width: 100%; }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 160px; padding: 11px 12px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit;
  }
  textarea:focus, .chip:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.send {
    border: 0; border-radius: 12px; padding: 0 18px; background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .empty { text-align: center; color: var(--muted); margin-top: 12vh; }
  .empty .big { font-size: 28px; color: var(--ink); margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1>物知りの友 <span>The All-Knowing</span></h1>
  <div id="meta"></div>
</header>
<main id="scroll"><div class="wrap" id="log">
  <div class="empty" id="empty">
    <div class="big">こんにちは 👋</div>
    今日は何を話しましょう？ · What shall we talk about today?<br>
    Tap <b>今日の話題</b> to start, or just type.
  </div>
</div></main>
<div class="chips" id="chips">
  <button class="chip" data-cmd="/daily">今日の話題 · Daily</button>
  <button class="chip" data-cmd="/surprise">驚きの事実 · Surprise</button>
  <button class="chip" data-cmd="/quiz">復習 · Quiz</button>
  <button class="chip" data-fill="/talk ">話す · Talk…</button>
  <button class="chip" data-fill="/dive ">深掘り · Dive…</button>
  <button class="chip" data-fill="/connect ">つなげる · Connect…</button>
  <button class="chip" data-cmd="/read">本棚 · Library</button>
  <button class="chip" data-cmd="/settings">設定 · Settings</button>
  <button class="chip" data-cmd="/wrap">保存して終了 · Wrap</button>
</div>
<form id="form">
  <textarea id="input" rows="1" placeholder="メッセージ / message…  (Enter to send, Shift+Enter for newline)"></textarea>
  <button class="send" id="send" type="submit">送信</button>
</form>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), send = $("send"), scroll = $("scroll");
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let sid = store.get("sensei-sid");
  if (!sid) { sid = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); store.set("sensei-sid", sid); }
  let password = store.get("sensei-pw") || "";
  let busy = false;

  fetch("/api/state").then(r => r.json()).then(s => {
    const st = s.settings;
    $("meta").textContent = `depth ${st.depth} · ${st.style}` + (s.due_reviews ? ` · 復習 ${s.due_reviews}` : "");
    if (s.password_required && !password) {
      password = prompt("Password / パスワード") || "";
      store.set("sensei-pw", password);
    }
  }).catch(() => {});

  // Tiny, safe Markdown renderer (escape first, then format).
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/(^|\s)_([^_\n]+)_(?=\s|$|[.,!?)])/g, "$1<em>$2</em>");
  function md(src) {
    const lines = esc(src).split("\n"); let html = "", list = null, para = [], table = [];
    const flushPara = () => { if (para.length) { html += "<p>" + inline(para.join("<br>")) + "</p>"; para = []; } };
    const flushList = () => { if (list) { html += `</${list}>`; list = null; } };
    const flushTable = () => {
      if (!table.length) return;
      const rows = table.filter(r => !/^\|[\s\-:|]+\|$/.test(r));
      html += "<table>" + rows.map((r, i) => "<tr>" + r.replace(/^\||\|$/g, "").split("|")
        .map(c => `<${i ? "td" : "th"}>${inline(c.trim())}</${i ? "td" : "th"}>`).join("") + "</tr>").join("") + "</table>";
      table = [];
    };
    for (const line of lines) {
      const t = line.trim();
      if (t.startsWith("|")) { flushPara(); flushList(); table.push(t); continue; } else flushTable();
      let m;
      if ((m = t.match(/^#{1,6}\s+(.*)/))) { flushPara(); flushList(); html += `<h4>${inline(m[1])}</h4>`; }
      else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { flushPara(); if (list !== "ul") { flushList(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { flushPara(); if (list !== "ol") { flushList(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
      else if (!t) { flushPara(); flushList(); }
      else { flushList(); para.push(line); }
    }
    flushPara(); flushList(); flushTable();
    return html;
  }

  function bubble(who, text) {
    $("empty")?.remove();
    const div = document.createElement("div");
    div.className = "msg " + (who === "me" ? "me" : "sensei");
    if (who === "me") div.textContent = text;
    else div.innerHTML = '<div class="who">Sensei 先生</div><div class="body"></div>';
    log.appendChild(div);
    scroll.scrollTop = scroll.scrollHeight;
    return div;
  }

  async function ask(text) {
    if (busy || !text.trim()) return;
    busy = true; send.disabled = true;
    bubble("me", text);
    const out = bubble("sensei").querySelector(".body");
    out.textContent = "…";
    const headers = { "Content-Type": "application/json", "X-Sensei-Password": password };
    const wrap = text.trim().toLowerCase() === "/wrap";
    try {
      const res = await fetch(wrap ? "/api/wrap" : "/api/chat", { method: "POST", headers, body: JSON.stringify({ sid, text }) });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        if (res.status === 401) store.set("sensei-pw", "");
        out.textContent = "⚠️ " + (err.error || res.statusText);
      } else if (wrap) {
        out.innerHTML = md((await res.json()).text);
      } else {
        const reader = res.body.getReader(), dec = new TextDecoder(); let acc = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          acc += dec.decode(value, { stream: true });
          out.innerHTML = md(acc);
          scroll.scrollTop = scroll.scrollHeight;
        }
        if (!acc) out.textContent = "(no reply)";
      }
    } catch (e) {
      out.textContent = "⚠️ Connection lost. Is the server running?";
    }
    busy = false; send.disabled = false; input.focus();
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); const t = input.value; input.value = ""; autosize(); ask(t); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
  });
  const autosize = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; };
  input.addEventListener("input", autosize);
  $("chips").addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    if (b.dataset.cmd) ask(b.dataset.cmd);
    else { input.value = b.dataset.fill; input.focus(); }
  });
})();
</script>
</body>
</html>
